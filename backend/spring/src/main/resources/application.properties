spring.application.name=url-shortener-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DB_USERNAME:url_shortener_app}
spring.datasource.password=${DB_PASSWORD:url_shortener_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.base-url=${APP_BASE_URL:http://localhost:8080}